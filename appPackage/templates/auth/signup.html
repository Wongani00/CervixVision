<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta http-equiv="Cache-Control" content="must-revalidate" />
    <meta name="description" content="Cervical Cancer Prediction System" />
    <meta name="keywords" content="Cervical Cancer, Prediction, Healthcare" />
    <meta name="author" content="Health System Team" />
    <link
      icons
      rel="icon"
      href="{{url_for('static', filename='hospital-healthcare-and-medical-svgrepo-com.svg')}}"
    />
    <link rel="icon" type="image/icon" href="img/favicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{url_for('static', filename='forms.css')}}" />
    <title>Register</title>
  </head>
  <body>
    <div class="form-container" id="form-cont">
      <div
        class="relative mx-auto w-full max-w-md bg-white px-6 pt-10 pb-8 mt-4 shadow-xl ring-1 ring-gray-900/5 sm:rounded-xl sm:px-10"
      >
        <div class="w-full">
          <div class="text-center">
            <h1 class="text-3xl font-semibold text-gray-900">Create Account</h1>
          </div>
          <div class="mt-8">
            <form action="" onsubmit="handleSignupSubmit(event)">
              <div class="relative mt-6">
                <input
                  type="text"
                  name="firstname"
                  id="firstname"
                  placeholder="First Name"
                  class="peer mt-1 w-full border-b-2 border-gray-300 px-0 py-1 placeholder:text-transparent focus:border-gray-500 focus:outline-none"
                  autocomplete="NA"
                  required
                />
                <label
                  for="firstname"
                  class="pointer-events-none absolute top-0 left-0 origin-left -translate-y-1/2 transform text-sm text-gray-800 opacity-75 transition-all duration-100 ease-in-out peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-0 peer-focus:pl-0 peer-focus:text-sm peer-focus:text-gray-800"
                  >First Name</label
                >
              </div>
              <p
                id="firstname-error"
                class="error mt-1 text-sm text-red-600"
                style="color: red; font-size: 13px; font-weight: 400"
              ></p>
              <div class="relative mt-6">
                <input
                  type="text"
                  name="surname"
                  id="surname"
                  placeholder="Surname"
                  class="peer mt-1 w-full border-b-2 border-gray-300 px-0 py-1 placeholder:text-transparent focus:border-gray-500 focus:outline-none"
                  autocomplete="NA"
                  required
                />
                <label
                  for="surname"
                  class="pointer-events-none absolute top-0 left-0 origin-left -translate-y-1/2 transform text-sm text-gray-800 opacity-75 transition-all duration-100 ease-in-out peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-0 peer-focus:pl-0 peer-focus:text-sm peer-focus:text-gray-800"
                  >Surname</label
                >
              </div>
              <p
                id="surname-error"
                class="error mt-1 text-sm text-red-600"
                style="color: red; font-size: 13px; font-weight: 400"
              ></p>
              <div class="relative mt-6">
                <input
                  type="email"
                  name="email"
                  id="email"
                  placeholder="Email Address"
                  class="peer mt-1 w-full border-b-2 border-gray-300 px-0 py-1 placeholder:text-transparent focus:border-gray-500 focus:outline-none"
                  autocomplete="NA"
                  required
                />
                <label
                  for="email"
                  class="pointer-events-none absolute top-0 left-0 origin-left -translate-y-1/2 transform text-sm text-gray-800 opacity-75 transition-all duration-100 ease-in-out peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-0 peer-focus:pl-0 peer-focus:text-sm peer-focus:text-gray-800"
                  >Email Address</label
                >
              </div>
              <p
                id="email-error"
                class="error mt-1 text-sm text-red-600"
                style="color: red; font-size: 13px; font-weight: 400"
              ></p>
              <div class="relative mt-6">
                <select
                  type="text"
                  name="role"
                  id="role"
                  placeholder="Role"
                  class="peer mt-1 w-full border-b-2 border-gray-300 px-0 py-1 placeholder:text-transparent focus:border-gray-500 focus:outline-none"
                  autocomplete="NA"
                  required
                >
                  <option value="" disabled selected hidden></option>
                  <option value="doctor">Doctor</option>
                  <option value="nurse">Nurse</option>
                </select>
                <label
                  for="role"
                  class="pointer-events-none absolute top-0 left-0 origin-left -translate-y-1/2 transform text-sm text-gray-800 opacity-75 transition-all duration-100 ease-in-out peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-0 peer-focus:pl-0 peer-focus:text-sm peer-focus:text-gray-800"
                  >Select Role</label
                >
              </div>
              <p
                id="role-error"
                class="error mt-1 text-sm text-red-600"
                style="color: red; font-size: 13px; font-weight: 400"
              ></p>
              <div class="relative mt-6">
                <select
                  type="text"
                  name="gender"
                  id="gender"
                  placeholder="gender"
                  class="peer mt-1 w-full border-b-2 border-gray-300 px-0 py-1 placeholder:text-transparent focus:border-gray-500 focus:outline-none"
                  autocomplete="NA"
                  required
                >
                  <option value="" disabled selected hidden></option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
                <label
                  for="gender"
                  class="pointer-events-none absolute top-0 left-0 origin-left -translate-y-1/2 transform text-sm text-gray-800 opacity-75 transition-all duration-100 ease-in-out peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-0 peer-focus:pl-0 peer-focus:text-sm peer-focus:text-gray-800"
                  >Select Gender</label
                >
              </div>
              <p
                id="gender-error"
                class="error mt-1 text-sm text-red-600"
                style="color: red; font-size: 13px; font-weight: 400"
              ></p>
              <div class="relative mt-6">
                <input
                  type="password"
                  name="password"
                  id="password"
                  placeholder="Password"
                  class="peer mt-1 w-full border-b-2 border-gray-300 px-0 py-1 placeholder:text-transparent focus:border-gray-500 focus:outline-none"
                  required
                />
                <label
                  for="password"
                  class="pointer-events-none absolute top-0 left-0 origin-left -translate-y-1/2 transform text-sm text-gray-800 opacity-75 transition-all duration-100 ease-in-out peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-0 peer-focus:pl-0 peer-focus:text-sm peer-focus:text-gray-800"
                  >Password</label
                >
              </div>
              <p
                id="password-error"
                class="error mt-1 text-sm text-red-600"
                style="color: red; font-size: 13px; font-weight: 400"
              ></p>

              <div class="my-6">
                <button
                  type="submit"
                  class="w-full rounded-md bg-blue-600 px-3 py-2 text-white focus:bg-gray-600 focus:outline-none"
                >
                  Register
                </button>
              </div>
              <!-- success alert -->
              <div
                class="alert alert-success"
                id="success-message"
                style="display: none"
              >
                <stong class="text-success">Success!</stong> Your account has
                been created successfully.
              </div>
              <p class="text-center text-sm text-gray-500">
                Already have an account yet?
                <a
                  href="{{url_for('auth.login')}}"
                  class="font-semibold text-gray-600 hover:underline focus:text-gray-800 focus:outline-none"
                  >Sign in </a
                >.
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="{{url_for('static', filename='script.js')}}"></script>
  </body>
</html>
