<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cervical Cancer Prediction System - Set New Password"
    />
    <meta
      name="keywords"
      content="Cervical Cancer, Prediction, Healthcare, Password Reset"
    />
    <meta name="author" content="Health System Team" />
    <link
      icons
      rel="icon"
      href="{{url_for('static', filename='hospital-healthcare-and-medical-svgrepo-com.svg')}}"
    />
    <link rel="icon" type="image/icon" href="img/favicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{{url_for('static', filename='forms.css')}}" />
    <title>Set New Password - Healthcare System</title>
  </head>
  <body>
    <div class="form-container" id="form-cont">
      <div
        class="relative mx-auto w-full max-w-md bg-white px-6 pt-10 pb-8 mt-4 shadow-xl ring-1 ring-gray-900/5 sm:rounded-xl sm:px-10"
      >
        <div class="w-full">
          <div class="text-center">
            <h1 class="text-3xl font-semibold text-gray-900">
              Set New Password
            </h1>
            <p class="mt-2 text-sm text-gray-600">
              Enter your new password below.
            </p>
          </div>
          <div class="mt-8">
            <form action="" onsubmit="handlePasswordResetSubmit(event)">
              <div class="relative mt-6">
                <input
                  type="password"
                  name="password"
                  id="password"
                  placeholder="New Password"
                  class="peer mt-1 w-full border-b-2 border-gray-300 px-0 py-1 placeholder:text-transparent focus:border-gray-500 focus:outline-none"
                  autocomplete="new-password"
                  required
                />
                <label
                  for="password"
                  class="pointer-events-none absolute top-0 left-0 origin-left -translate-y-1/2 transform text-sm text-gray-800 opacity-75 transition-all duration-100 ease-in-out peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-0 peer-focus:pl-0 peer-focus:text-sm peer-focus:text-gray-800"
                  >New Password</label
                >
                <div
                  class="text-red-500 text-sm mt-1"
                  id="password-error"
                  style="display: none"
                ></div>
              </div>

              <div class="relative mt-6">
                <input
                  type="password"
                  name="confirm_password"
                  id="confirm_password"
                  placeholder="Confirm New Password"
                  class="peer mt-1 w-full border-b-2 border-gray-300 px-0 py-1 placeholder:text-transparent focus:border-gray-500 focus:outline-none"
                  autocomplete="new-password"
                  required
                />
                <label
                  for="confirm_password"
                  class="pointer-events-none absolute top-0 left-0 origin-left -translate-y-1/2 transform text-sm text-gray-800 opacity-75 transition-all duration-100 ease-in-out peer-placeholder-shown:top-1/2 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 peer-focus:top-0 peer-focus:pl-0 peer-focus:text-sm peer-focus:text-gray-800"
                  >Confirm New Password</label
                >
                <div
                  class="text-red-500 text-sm mt-1"
                  id="confirm-password-error"
                  style="display: none"
                ></div>
              </div>

              <!-- Password requirements -->
              <div class="mt-4 text-sm text-gray-600">
                <p class="font-medium">Password requirements:</p>
                <ul class="mt-1 text-xs space-y-1">
                  <li>• At least 8 characters long</li>
                  <li>• Contains uppercase and lowercase letters</li>
                  <li>• Contains at least one number</li>
                  <li>• Contains at least one special character</li>
                </ul>
              </div>

              <div class="my-6">
                <button
                  type="submit"
                  id="resetBtn"
                  class="w-full rounded-md bg-blue-600 px-3 py-2 text-white hover:bg-blue-700 focus:bg-blue-700 focus:outline-none transition-colors duration-200"
                >
                  Update Password
                </button>
              </div>

              <!-- Success alert -->
              <div
                class="alert alert-success"
                id="reset-success"
                style="display: none"
              >
                <strong>Success!</strong> <span id="success-message"></span>
              </div>

              <!-- Error alert -->
              <div
                class="alert alert-danger alert-dismissible fade show"
                id="reset-error"
                style="display: none"
              >
                <button type="button" class="close" data-dismiss="alert">
                  &times;
                </button>
                <strong>Error!</strong> <span id="error-message"></span>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      async function handlePasswordResetSubmit(event) {
        event.preventDefault();

        const form = event.target;
        const password = form.password.value;
        const confirmPassword = form.confirm_password.value;
        const resetBtn = document.getElementById("resetBtn");
        const successAlert = document.getElementById("reset-success");
        const errorAlert = document.getElementById("reset-error");
        const successMessage = document.getElementById("success-message");
        const errorMessage = document.getElementById("error-message");

        // Hide previous alerts and field errors
        successAlert.style.display = "none";
        errorAlert.style.display = "none";
        document.getElementById("password-error").style.display = "none";
        document.getElementById("confirm-password-error").style.display =
          "none";

        // Show loading state
        resetBtn.disabled = true;
        resetBtn.textContent = "Updating...";

        try {
          const response = await fetch(window.location.href, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              password: password,
              confirm_password: confirmPassword,
            }),
          });

          const data = await response.json();

          if (data.success) {
            successMessage.textContent = data.message;
            successAlert.style.display = "block";
            form.reset();

            // Redirect to login after 2 seconds
            setTimeout(() => {
              window.location.href = data.redirect;
            }, 2000);
          } else {
            if (data.errors) {
              // Display field-specific errors
              for (const [field, message] of Object.entries(data.errors)) {
                const errorElement = document.getElementById(field + "-error");
                if (errorElement) {
                  errorElement.textContent = message;
                  errorElement.style.display = "block";
                }
              }
            } else {
              errorMessage.textContent =
                data.error || "An error occurred. Please try again.";
              errorAlert.style.display = "block";
            }
          }
        } catch (error) {
          console.error("Error:", error);
          errorMessage.textContent =
            "Network error. Please check your connection and try again.";
          errorAlert.style.display = "block";
        } finally {
          // Reset button state
          resetBtn.disabled = false;
          resetBtn.textContent = "Update Password";
        }
      }

      // Real-time password confirmation validation
      document
        .getElementById("confirm_password")
        .addEventListener("input", function () {
          const password = document.getElementById("password").value;
          const confirmPassword = this.value;
          const errorElement = document.getElementById(
            "confirm-password-error"
          );

          if (confirmPassword && password !== confirmPassword) {
            errorElement.textContent = "Passwords do not match";
            errorElement.style.display = "block";
          } else {
            errorElement.style.display = "none";
          }
        });
    </script>
  </body>
</html>
