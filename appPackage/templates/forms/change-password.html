<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/icon" href="img/favicon.svg" />
    <title>Reset Password</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .reset-container {
        background: #fff;
        padding: 2rem;
        max-width: 450px;
        width: 90%;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .reset-container h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #333;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      input[type="email"] {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 1rem;
      }

      button {
        width: 100%;
        padding: 0.75rem;
        border: none;
        background-color: #0d6efd;
        color: white;
        font-size: 1rem;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #0b3ead; /* Darker shade for hover effect */
      }

      @media (max-width: 480px) {
        .reset-container {
          padding: 1.5rem;
        }

        input[type="email"],
        button {
          font-size: 0.95rem;
          padding: 0.6rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="reset-container">
      <h2>Reset Password</h2>
      <form>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>
        <button type="submit">Send Reset Link</button>
      </form>
    </div>

    <script src="{{url_for('static', filename='script.js')}}"></script>
  </body>
</html>
